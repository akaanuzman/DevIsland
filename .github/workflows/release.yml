name: Signed macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: dev-island-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      RELEASE_REPO: akaanuzman/DevIsland-releases
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      DEV_ISLAND_SIGN_IDENTITY: ${{ vars.DEV_ISLAND_SIGN_IDENTITY }}
      DEV_ISLAND_NOTARY_PROFILE: dev-island-ci
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and required release configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import base64,os
          required=['GH_TOKEN','DEV_ISLAND_SIGN_IDENTITY','SPARKLE_PUBLIC_KEY','APPLE_CERTIFICATE','APPLE_CERTIFICATE_PASSWORD','APPLE_ID','APPLE_PASSWORD','APPLE_TEAM_ID','SPARKLE_PRIVATE_KEY']
          missing=[k for k in required if not os.environ.get(k)]
          if missing: raise SystemExit('Missing release configuration: '+', '.join(missing))
          if not os.environ['DEV_ISLAND_SIGN_IDENTITY'].startswith('Developer ID Application:'): raise SystemExit('Developer ID Application identity required')
          PY
          test "$GITHUB_REF_NAME" = "v$(python3 scripts/version.py version)"
          test -f "docs/releases/$(python3 scripts/version.py version).md"
          gh api "repos/$RELEASE_REPO" --jq '.private == false' | grep -qx true
      - name: Tests
        run: |
          bash scripts/swift.sh test
          node --test extensions/vscode/test/router.test.js
          python3 -m unittest discover -s scripts/tests -v
      - name: Import signing credentials into temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib,secrets
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'developer-id.p12').write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE'],validate=True))
          key=root/'sparkle.key';key.write_text(os.environ['SPARKLE_PRIVATE_KEY']);key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SPARKLE_PRIVATE_KEY_FILE='+str(key)+'\n')
              f.write('DEV_ISLAND_NOTARY_KEYCHAIN='+str(root/'dev-island.keychain-db')+'\n')
              f.write('CI_KEYCHAIN_PASSWORD='+secrets.token_hex(32)+'\n')
          PY
          source_password="$(sed -n 's/^CI_KEYCHAIN_PASSWORD=//p' "$GITHUB_ENV" | tail -1)"
          keychain="$RUNNER_TEMP/dev-island.keychain-db"
          security create-keychain -p "$source_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$source_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$source_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$DEV_ISLAND_NOTARY_PROFILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12"
      - name: Load public repository and previous appcast
        run: |
          gh repo clone "$RELEASE_REPO" .build/public-release
          cd .build/public-release
          git fetch origin
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
            test -s appcast.xml
            mkdir -p ../feed
            cp appcast.xml ../feed/appcast.xml
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
      - name: Build, notarize and sign update
        run: bash scripts/release.sh
      - name: Publish verified release assets
        run: |
          version="$(python3 scripts/version.py version)"
          options=()
          if [[ "$version" == *-beta.* ]]; then options+=(--prerelease); else options+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --title "Dev Island $version" --notes-file "docs/releases/$version.md" "${options[@]}" \
            "dist/Dev-Island-${version}-arm64.dmg" "dist/Dev-Island-${version}-arm64.zip" dist/SHA256SUMS
      - name: Publish appcast after release assets exist
        run: |
          cp .build/feed/appcast.xml .build/public-release/appcast.xml
          cd .build/public-release
          touch .nojekyll
          git config user.name 'Dev Island Release'
          git config user.email 'release@users.noreply.github.com'
          git add appcast.xml .nojekyll
          git commit -m "Publish $GITHUB_REF_NAME update feed"
          gh auth setup-git
          git push origin gh-pages
      - name: Remove credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dev-island.keychain-db" || true
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/developer-id.p12"
